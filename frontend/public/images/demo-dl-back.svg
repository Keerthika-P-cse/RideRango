  <line x1="430" y1="205" x2="430" y2="245" stroke="#ffffff" stroke-width="2" />
  <line x1="436" y1="205" x2="436" y2="245" stroke="#ffffff" stroke-width="4" />
  <line x1="445" y1="205" x2="445" y2="245" stroke="#ffffff" stroke-width="1" />
  <line x1="450" y1="205" x2="450" y2="245" stroke="#ffffff" stroke-width="3" />
  <line x1="460" y1="205" x2="460" y2="245" stroke="#ffffff" stroke-width="5" />
  <line x1="472" y1="205" x2="472" y2="245" stroke="#ffffff" stroke-width="2" />
  <line x1="480" y1="205" x2="480" y2="245" stroke="#ffffff" stroke-width="3" />
  <line x1="492" y1="205" x2="492" y2="245" stroke="#ffffff" stroke-width="4" />
