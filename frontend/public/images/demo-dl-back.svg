  <line x1="140" y1="75" x2="140" y2="185" stroke="#cbd5e1" stroke-width="1" />
  <line x1="330" y1="75" x2="330" y2="185" stroke="#cbd5e1" stroke-width="1" />

  <text x="85" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">CLASS</text>
  <text x="235" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">DESCRIPTION</text>
  <text x="445" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">ISSUE DATE</text>

  <text x="85" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">MCWG</text>
