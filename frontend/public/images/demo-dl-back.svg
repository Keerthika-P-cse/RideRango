  <g font-family="Arial, sans-serif" fill="#1e293b">
    <text x="35" y="215" font-size="11" fill="#64748b" font-weight="bold">REGISTERED ADDRESS:</text>
    <text x="180" y="215" font-size="11">42, 4th Cross, 100ft Road, Indiranagar</text>
    <text x="180" y="235" font-size="11">Bengaluru, Karnataka - 560038</text>

