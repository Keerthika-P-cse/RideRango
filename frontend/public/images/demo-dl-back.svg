  <text x="85" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">LMV</text>
  <text x="235" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">Light Motor Vehicle (Private)</text>
  <text x="445" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">20-03-2018</text>

