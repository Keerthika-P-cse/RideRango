  <text x="300" y="345" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif" font-size="11" font-weight="bold">BACK SIDE • FICTIONAL SAMPLE FOR COLLEGE PROJECT • NOT A REAL ID</text>
  <text x="300" y="360" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="10">RideRango Demonstration Architecture — Strictly Educational</text>
